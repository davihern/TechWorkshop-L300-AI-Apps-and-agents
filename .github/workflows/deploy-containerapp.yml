name: Build And Deploy Container App

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: chat-app
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.AZURE_CONTAINER_REGISTRY }}
          username: ${{ secrets.AZURE_CONTAINER_REGISTRY_USERNAME }}
          password: ${{ secrets.AZURE_CONTAINER_REGISTRY_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./src
          file: ./src/Dockerfile
          push: true
          tags: ${{ secrets.AZURE_CONTAINER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Update Azure Container App
        env:
          CONTAINER_APP_NAME: ${{ secrets.AZURE_CONTAINER_APP_NAME }}
          RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          CONTAINER_IMAGE: ${{ secrets.AZURE_CONTAINER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          FOUNDRY_ENDPOINT: ${{ secrets.FOUNDRY_ENDPOINT || secrets.foundry_endpoint }}
          gpt_endpoint: ${{ secrets.gpt_endpoint || secrets.GPT_ENDPOINT }}
          embedding_endpoint: ${{ secrets.embedding_endpoint || secrets.EMBEDDING_ENDPOINT }}
          phi_4_endpoint: ${{ secrets.phi_4_endpoint || secrets.PHI_4_ENDPOINT }}
        run: |
          az containerapp update \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$CONTAINER_IMAGE" \
            --set-env-vars \
              FOUNDRY_ENDPOINT="$FOUNDRY_ENDPOINT" \
              gpt_endpoint="$gpt_endpoint" \
              embedding_endpoint="$embedding_endpoint" \
              phi_4_endpoint="$phi_4_endpoint"